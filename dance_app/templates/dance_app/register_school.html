<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Dance School</title>

  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #d6d5d6;
      color: #222;
      text-align: center;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h2 {
      font-family: "Great Vibes", cursive;
      font-size: 52px;
      color: #004c43;
      margin-bottom: 30px;
    }

    form {
      background-color: #f0f0f0;
      padding: 30px 40px;
      border-radius: 12px;
      max-width: 400px;
      width: 100%;
      text-align: left;
      box-shadow: none; /* flat, consistent look */
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: 500;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #bbb;
      border-radius: 6px;
      margin-top: 4px;
      font-size: 16px;
      box-shadow: none;
      outline: none;
      background-color: #fff;
    }

    input:focus, textarea:focus {
      border-color: #004c43;
    }

    button {
      display: block;
      background-color: #004c43;
      color: white;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      margin-top: 20px;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background-color: #003832;
    }
  </style>
</head>

<body>
  <h2>Register Dance School</h2>
  <form method="POST">
    {% csrf_token %}
    <label>School Name</label>
    <input type="text" name="name" required>

    <label>Address</label>
    <input type="text" name="address" required>

    <label>City</label>
    <input type="text" name="city" required>

    <label>Contact Email</label>
    <input type="email" name="contact_email" required>

    <label>Phone Number</label>
    <input type="tel" name="phone_number" required>

    <label>Dances Taught</label>
    <textarea name="dances_taught" rows="3" placeholder="Salsa, Zumba, Bachata, Tango, Waltz" required></textarea>

    <label>Classes per Week</label>
    <input type="number" name="classes_per_week" min="1" required>

    <button type="submit">Submit</button>
  </form>
</body>
</html>
