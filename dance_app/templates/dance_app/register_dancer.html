<!DOCTYPE html>
<html>
<head>
    <title>Dancer Registration</title>
</head>
<body>
    <h2>Dancer Registration</h2>
    <form method="POST">
        {% csrf_token %}
        <label>First Name:</label><br><input type="text" name="first_name"><br><br>

        <label>Last Name:</label><br><input type="text" name="last_name"><br><br>

        <label>Age:</label><br><input type="number" name="age"><br><br>

        <label>Phone Number:</label><br><input type="tel" name="phone"><br><br>

        <label>City:</label><br><input type="text" name="city"><br><br>

        <label>Dance Style:</label><br>
        <input type="text" name="dance_style" placeholder="Hip-Hop, Salsa, Tango, etc."><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
