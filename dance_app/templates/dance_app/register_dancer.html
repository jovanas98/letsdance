<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dancer Registration</title>

  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #d6d5d6;
      color: #222;
      text-align: center;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h2 {
      font-family: "Great Vibes", cursive;
      font-size: 52px;
      color: #004c43;
      margin-bottom: 20px;
    }

    .link-button {
      display: inline-block;
      background-color: #004c43;
      color: white;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      margin-bottom: 30px;
      cursor: pointer;
      text-decoration: none;
    }

    .link-button:hover {
      background-color: #003832;
    }

    form {
      background-color: #f0f0f0;
      padding: 30px 40px;
      border-radius: 12px;
      max-width: 400px;
      width: 100%;
      text-align: left;
      box-shadow: none;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #bbb;
      border-radius: 6px;
      margin-top: 4px;
      font-size: 16px;
      background-color: #fff;
      outline: none;
    }

    input:focus {
      border-color: #004c43;
    }

    button {
      display: block;
      background-color: #004c43;
      color: white;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      margin-top: 20px;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background-color: #003832;
    }
  </style>
</head>

<body>
  <h2>Dancer Registration</h2>

  <a href="{% url 'school_list' %}" class="link-button">View Dance Schools</a>

  <form method="POST">
    {% csrf_token %}
    <label>First Name</label>
    <input type="text" name="first_name" required>

    <label>Last Name</label>
    <input type="text" name="last_name" required>

    <label>Age</label>
    <input type="number" name="age" min="1" required>

    <label>Phone Number</label>
    <input type="tel" name="phone" required>

    <label>City</label>
    <input type="text" name="city" required>

    <label>Preferred Dance Style</label>
    <input type="text" name="dance_style" placeholder="Hip-Hop, Salsa, Tango..." required>

    <button type="submit">Submit</button>
  </form>
</body>
</html>
