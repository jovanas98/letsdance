<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Dance</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
    body {
        font-family: "Poppins", sans-serif;
        background-color: #d6d5d6; 
        color: #222;
        text-align: center;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    h1 {
        font-family: "Great Vibes", cursive;
        font-size: 64px;
        color: #004c43; 
        margin-bottom: 50px;
    }

    .button {
        display: inline-block;
        background-color: #004c43; 
        color: white;
        font-size: 20px;
        text-decoration: none;
        padding: 14px 36px;
        border-radius: 8px;
        margin: 12px;
        cursor: pointer;
        border: none;
    }

    .button:hover {
        background-color: #003832; 
    }

    footer {
        position: absolute;
        bottom: 15px;
        font-size: 14px;
        color: #555;
    }
</style>
</head>

<body>
    <h1>Let's Dance</h1>

    <a href="{% url 'register_dancer' %}" class="button">I am a Dancer</a>
    <a href="{% url 'register_school' %}" class="button">I am a Dance School</a>

    <footer>Your next (dance) step starts here.</footer>
</body>
</html>
